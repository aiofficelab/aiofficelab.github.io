<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관심종목 리포트 — 2026-08-30</title>
<style>
:root{
  --bg:#eae9e9; --paper:#f8f6f5; --paper2:#f1efee;
  --ink:#201e1d; --ink2:#605d5d; --ink3:#8a8686;
  --rule:rgba(32,30,29,.42); --rule-soft:rgba(32,30,29,.15);
  --accent:#ec3013; --accent-700:#ae1800; --accent-100:#fff2ef;
  --blue:#1157cf; --blue-700:#0b3d96; --blue-100:#eef3fd;
  --font:"Archivo","Pretendard","Malgun Gothic",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131211; --paper:#1b1918; --paper2:#232120;
  --ink:#f2efed; --ink2:#b3aeab; --ink3:#8a8481;
  --rule:rgba(242,239,237,.44); --rule-soft:rgba(242,239,237,.15);
  --accent:#ff5330; --accent-700:#ff8062; --accent-100:#2c1a15;
  --blue:#6ea3ff; --blue-700:#9dc0ff; --blue-100:#141d2e;
}}
*{box-sizing:border-box}
/* 부모 사이트에 iframe으로 실린 상태
   · 제목은 부모가 이미 보여주므로 머리글을 접는다
   · 부모가 iframe 높이를 내용에 맞춰 늘려서 자체 스크롤이 없다 → sticky·fixed 해제
   · 바탕은 부모의 프레임 카드(#fff)에 맞춰 이음매를 없앤다 (--paper 하나만 바꾸면 전부 따라온다) */
body.embed{--paper:#fff}
body.embed .mast{display:none}
body.embed .wrap{padding-top:0}
body.embed .nav{position:static;margin-top:0;border-top:0}
body.embed section,body.embed .sub{scroll-margin-top:8px}
body.embed .top{display:none}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 13px/1.55 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
b,strong{font-weight:700}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:26px 20px 44px}

/* 머리 */
.kick{font-size:10px;letter-spacing:.2em;font-weight:700;color:var(--accent)}
.mast h1{font-size:30px;line-height:1.12;margin:7px 0 0}
.mast .dt{margin-top:7px;font-size:12px;color:var(--ink2)}
.rule{height:2px;background:var(--rule);margin:16px 0 0}
.lead{display:flex;gap:12px;align-items:baseline;background:var(--paper2);
  border-left:3px solid var(--accent);padding:11px 14px;margin:16px 0 0}
.lead .lk{font-size:9.5px;letter-spacing:.16em;color:var(--ink3);font-weight:700;white-space:nowrap}
.lead p{margin:0;font-size:14.5px;font-weight:700}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:18px;
  border-top:2px solid var(--rule);border-bottom:2px solid var(--rule)}
.kpi{padding:13px 16px}
.kpi+.kpi{border-left:1px solid var(--rule-soft)}
.kpi .k{font-size:9.5px;letter-spacing:.16em;color:var(--ink3);font-weight:700}
.kpi .v{font-size:26px;font-weight:800;line-height:1.1;margin-top:3px;letter-spacing:-.02em}
.kpi .sc{font-size:10.5px;color:var(--ink3);margin-top:2px}

/* 상단 네비 — 사이트 상단 바와 같은 문법(플랫·2px 괘선·구분선) */
.nav{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;margin:16px 0 0;
  background:var(--paper);border-top:2px solid var(--rule);border-bottom:2px solid var(--rule)}
.nav a{padding:8px 14px;font-size:12px;font-weight:700;color:var(--ink2);text-decoration:none;
  white-space:nowrap;border-right:1px solid var(--rule-soft)}
.nav a:first-child{padding-left:0}
.nav a:hover{background:rgba(128,128,128,.12);color:var(--ink)}
.nav .sep{flex:1;border-right:0}

/* 섹션 */
section{margin-top:34px;scroll-margin-top:46px}
.sub{scroll-margin-top:46px}
/* 참고지표 하위 블록 — 섹션보다 한 단 낮은 머리 */
.subh{display:flex;align-items:baseline;gap:9px;margin:26px 0 0;padding-bottom:5px;
  border-bottom:1px solid var(--rule)}
.subh h3{font-size:14px;font-weight:800;letter-spacing:-.01em}
.subh .en{margin-left:auto;font-size:9px;letter-spacing:.16em;color:var(--ink3);font-weight:700}
.sh{display:flex;align-items:baseline;gap:11px;border-bottom:2px solid var(--rule);padding-bottom:7px}
.sh .no{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
.sh h2{font-size:17px}
.sh .en{margin-left:auto;font-size:9.5px;letter-spacing:.16em;color:var(--ink3)}
.note{color:var(--ink3);font-size:11px;line-height:1.65;margin:8px 0 0}
.note b{color:var(--ink2)}

/* 탭 */
.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--rule);margin-top:14px}
.tabs button{padding:7px 14px;font-size:12px;font-weight:600;color:var(--ink2);
  border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button:hover{background:rgba(128,128,128,.12);color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:800;border-bottom-color:var(--accent)}

/* 그룹 성과 막대 */
.gbars{margin-top:14px;display:grid;grid-template-columns:150px 1fr 84px;gap:6px 12px;align-items:center}
.gbars .gl{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbars .gl::before{content:"";display:inline-block;width:7px;height:7px;background:var(--accent);
  margin-right:8px;vertical-align:middle;position:relative;top:-1px}
.gbars .gt{position:relative;height:16px;background:linear-gradient(var(--rule-soft),var(--rule-soft)) center/1px 100% no-repeat}
.gbars .gt i{position:absolute;top:2px;bottom:2px;display:block}
.gbars .gv{font-size:12px;font-weight:800;text-align:right}

/* 표 */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.g{border-collapse:collapse;width:100%;min-width:700px}
table.g th{font-size:9.5px;letter-spacing:.1em;font-weight:700;color:var(--ink3);
  padding:10px 7px 6px;border-bottom:2px solid var(--rule);text-align:right;white-space:nowrap}
table.g th:first-child{text-align:left}
table.g th.s{cursor:pointer;user-select:none}
table.g th.s:hover{color:var(--ink)}
table.g th .aw{color:var(--accent);font-size:8px;margin-left:3px}
table.g td{font-size:12px;padding:6px 7px;border-bottom:1px solid var(--rule-soft);
  text-align:right;white-space:nowrap}
table.g td:first-child{text-align:left}
table.g tr.hd td{padding:20px 7px 6px;font-weight:800;font-size:13px;border-bottom:none}
table.g tr.hd td::before{content:"";display:inline-block;width:7px;height:7px;background:var(--accent);
  margin-right:8px;vertical-align:middle;position:relative;top:-1px}
/* 그룹 표식 — 이모지 대신 로고와 같은 빨간 정사각 */
.gmk::before{content:"";display:inline-block;width:7px;height:7px;background:var(--accent);
  margin-right:8px;vertical-align:middle;position:relative;top:-1px}
table.g tr.gr{cursor:pointer}
table.g tr.gr:hover td{background:rgba(128,128,128,.10)}
table.g tr.gr td{padding:11px 7px;font-size:12.5px}
table.g tr.gr.op td{background:var(--accent-100)}
/* 그룹 상세 — 요약 행 바로 아래에서 펼쳐진다 */
table.g tr.gdt>td{background:var(--paper2);padding:2px 0 14px 18px}
table.g table.gsub{min-width:0;background:transparent}
table.g table.gsub th{padding-top:12px}
table.g table.gsub td{font-size:11.5px}
table.g tr.av td{border-top:2px solid var(--rule);font-weight:800}
table.g tr.r{cursor:pointer}
table.g tr.r:hover td{background:rgba(128,128,128,.10)}
table.g tr.r.op td{background:var(--accent-100)}
.tk{font-weight:800}
.nm{color:var(--ink3);font-size:11px;margin-left:6px}
.val{font-weight:800}
.up{color:var(--accent-700)}
.dn,.neg{color:var(--blue-700)}
.flat,.dash{color:var(--ink3)}

/* 스파크라인 — display:block 이면 셀의 우측정렬을 무시하고 왼쪽에 붙어
   머리글('6개월')과 칸이 어긋난다. inline-block 이어야 숫자 열들과 같이 오른쪽에 선다. */
svg.sp{display:inline-block;vertical-align:middle}
table.g td.spk{text-align:left}
.sp .ln{fill:none;stroke:var(--ink2);stroke-width:1.3}
.sp .ar{fill:var(--rule-soft)}

/* 행 펼침 */
tr.dt td{background:var(--paper2);padding:14px 12px 16px}
.bars{display:grid;grid-template-columns:170px 1fr 96px;gap:6px 12px;align-items:center;max-width:660px}
.bars .bn{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .bt{background:rgba(128,128,128,.15);height:11px;position:relative}
.bars .bt i{position:absolute;top:0;bottom:0;left:0;display:block;background:var(--accent)}
.bars .bt i.neg{background:var(--blue)}
.bars .bv{font-size:11.5px;font-weight:800;text-align:right;white-space:nowrap}
.bars .bv small{font-weight:600;color:var(--ink3);margin-left:5px}

/* 동행성 — 종목별 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:0;margin-top:14px;
  border-top:1px solid var(--rule-soft);border-left:1px solid var(--rule-soft)}
/* auto-fill 열 수가 화면 폭에 따라 바뀌므로 nth-child로 세로선을 그으면 어긋난다 —
   모든 카드에 오른쪽 선을 주고 컨테이너가 왼쪽을 맡는다 */
.card{padding:12px 14px 14px;border-bottom:1px solid var(--rule-soft);
  border-right:1px solid var(--rule-soft)}
.card .ct{font-size:12.5px;font-weight:800}
.card .ct .nm{font-weight:400}
.card .rows{margin-top:8px;display:grid;grid-template-columns:1fr 60px 30px;gap:4px 8px;align-items:center}
.card .rn{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rb{height:9px;background:rgba(128,128,128,.15);position:relative}
.card .rb i{position:absolute;top:0;bottom:0;left:0;background:var(--accent)}
.card .rb i.neg{background:var(--blue)}
.card .rv{font-size:11px;font-weight:800;text-align:right}
.card .none{font-size:11px;color:var(--ink3);margin-top:7px}

/* 히트맵 */
.heat{border-collapse:collapse;margin-top:6px}
.heat.core th.ch{font-size:10.5px;font-weight:700;color:var(--ink2);padding:0 6px 6px;
  text-align:center;border-bottom:2px solid var(--rule);white-space:nowrap}
.heat.core td.cc{width:auto;min-width:74px;height:28px;font-size:11px;font-weight:700;
  letter-spacing:-.01em;text-align:center;border:1px solid var(--paper)}
.tog{font-size:11px;font-weight:700;color:var(--accent-700);text-decoration:underline;
  text-underline-offset:3px;padding:0}
.tog:hover{color:var(--accent)}
.heat th.ind{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:600;
  color:var(--ink2);padding:6px 1px;height:132px;vertical-align:bottom}
.heat th.pf{position:sticky;left:0;background:var(--paper);text-align:left;font-size:11px;
  font-weight:700;padding:0 9px 0 0;white-space:nowrap;z-index:2}
.heat th.gb{text-align:left;font-size:9.5px;letter-spacing:.16em;color:var(--ink3);font-weight:700;
  padding:0 0 4px 3px;border-bottom:2px solid var(--rule);white-space:nowrap}
.heat th.gb+th.gb{border-left:1px solid var(--paper)}
.heat th.gp{text-align:left;font-size:10px;letter-spacing:.14em;color:var(--ink3);
  padding:12px 0 4px;font-weight:700;position:sticky;left:0;background:var(--paper)}
.heat th.gp::before{content:"";display:inline-block;width:6px;height:6px;background:var(--accent);
  margin-right:7px;vertical-align:middle;position:relative;top:-1px}
.heat td{width:24px;height:22px;border:1px solid var(--paper)}
.heat td:hover{outline:2px solid var(--ink);outline-offset:-2px}
.legend{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.legend i{display:inline-block;width:22px;height:12px}

footer{border-top:2px solid var(--rule);margin-top:38px;padding-top:13px;
  color:var(--ink3);font-size:11px;line-height:1.7}
footer p{margin:0}
footer .w{color:var(--ink2);margin-top:7px}
/* 위로가기 — 라운드 0·2px 잉크 테두리, 호버 시 빨강 (사이트 문법 유지) */
.top{position:fixed;right:18px;bottom:18px;z-index:30;width:40px;height:40px;
  display:grid;place-items:center;background:var(--paper);color:var(--ink);
  border:2px solid var(--ink);font-size:15px;line-height:1;
  opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s}
.top.on{opacity:1;visibility:visible}
.top:hover{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:640px){.top{right:12px;bottom:12px;width:36px;height:36px}}
[hidden]{display:none!important}
@media(max-width:640px){
  .kpis{grid-template-columns:1fr}
  .kpi+.kpi{border-left:0;border-top:1px solid var(--rule-soft)}
  .mast h1{font-size:24px}
  .cards{grid-template-columns:1fr}
  .card:nth-child(odd){border-right:0}
}
</style>

  return '<span class="'+cls(v)+'">'+(v>0?"▲":"▼")+Math.abs(v).toFixed(d)+u+"</span>"}


/* 스파크라인 — 0~100 정규화 배열 */
function spark(a){if(!a||a.length<2)return "";
  var w=76,h=22,st=w/(a.length-1),pts=[],i;
  for(i=0;i<a.length;i++)pts.push((i*st).toFixed(1)+","+(h-1-a[i]/100*(h-3)).toFixed(1));
  var last=a[a.length-1],first=a[0];
  return '<svg class="sp" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+
    '<polygon class="ar" points="0,'+h+' '+pts.join(" ")+' '+w+','+h+'"/>'+
    '<polyline class="ln" points="'+pts.join(" ")+'" style="stroke:'+(last>=first?"var(--accent)":"var(--blue)")+'"/></svg>'}

/* 상관계수 표기 — 0을 떼지 않는다. 앞서 '.92'로 줄였다가 무슨 뜻인지 알 수 없다는 지적을 받았다 */
function rTxt(r){return (r<0?"−":"+")+Math.abs(r).toFixed(2)}
function rWord(r){var a=Math.abs(r);
  return a>=.9?"거의 똑같이":a>=.75?"매우 비슷하게":a>=.6?"비슷하게":
         a>=.45?"어느 정도":a>=.3?"약하게":"뚜렷하지 않게"}
/* 표시용 이름 — 국내 종목은 코드(114800)가 아니라 종목명(KODEX 인버스)을 앞에 둔다.
   미국 종목은 티커 자체가 이름 노릇을 하므로 그대로 둔다. */
var DISP={},ALT={};
D.groups.forEach(function(g){g.rows.forEach(function(r){
  DISP[r.name]=r.disp||r.name; ALT[r.name]=r.alt||""})});
function dsp(t){return DISP[t]||t}

function topOf(t,n,min){var m=D.drivers.matrix[t]||{},a=[],k;
  for(k in m){if(Math.abs(m[k])>=(min==null?D.minR:min))a.push([k,m[k]])}
  a.sort(function(x,y){return Math.abs(y[1])-Math.abs(x[1])});return a.slice(0,n)}

/* ── 머리 ─────────────────────────────────────────────── */
$("#h1").textContent="관심종목 리포트";
$("#dt").innerHTML=esc(D.dateLabel)+" · 한국 전일 종가 · 미국/유럽 지난밤 마감";
if(D.ai){$("#lead").hidden=false;$("#leadTxt").textContent=D.ai}
var T=D.total;
$("#kpis").innerHTML=[["전일비",T.prev],["전월말비",T.mEnd],["작년말비",T.yEnd]].map(function(x){

    '<div class="sc">관심종목 '+T.n+'개 동일가중 단순평균</div></div>'}).join("");

/* ── 01 관심종목 ──────────────────────────────────────── */
var GF="ALL",SORT=null,SDIR=-1;
function key(r,k){return k==="last"?r.last:r.chg[+k]}
function pills(){$("#gp").innerHTML='<button data-g="ALL" class="on">전체</button>'+
  D.groups.map(function(g){return '<button data-g="'+esc(g.dna)+'">'+esc(g.label)+"</button>"}).join("")}
function gbars(){
  var mx=0;D.groups.forEach(function(g){if(g.avg.prev!=null)mx=Math.max(mx,Math.abs(g.avg.prev))});
  $("#gb").innerHTML=D.groups.map(function(g){
    var v=g.avg.prev,w=v==null?0:Math.min(Math.abs(v)/(mx||1),1)*50;
    var st=v>=0?"left:50%;width:"+w+"%;background:var(--accent)":"right:50%;width:"+w+"%;background:var(--blue)";
    return '<div class="gl">'+esc(g.label)+'</div><div class="gt"><i style="'+st+'"></i></div>'+
      '<div class="gv '+cls(v)+'">'+(v==null?"—":(v>0?"+":"")+v.toFixed(2)+"%")+"</div>"}).join("")}
function rowH(r){
  var tp=topOf(r.name,1);
  var td=tp.length?'<b>'+esc(tp[0][0])+'</b> <span class="'+(tp[0][1]<0?"neg":"up")+'">'+rTxt(tp[0][1])+"</span>"
                  :'<span class="dash">—</span>';
  return '<tr class="r" data-t="'+esc(r.name)+'"><td><span class="tk">'+esc(r.disp||r.name)+
    '</span><span class="nm">'+esc(r.alt||"")+"</span></td>"+
    '<td class="spk">'+spark(r.spark)+"</td>"+
    '<td class="val">'+(r.last==null?'<span class="dash">데이터 없음</span>':esc(r.pfx)+num(r.last,r.d))+"</td>"+
    "<td>"+chgTxt(r.chg[0])+"</td><td>"+chgTxt(r.chg[1])+"</td><td>"+chgTxt(r.chg[2])+"</td>"+
    '<td style="text-align:left;font-size:11px;color:var(--ink3)">'+td+"</td></tr>"}
/* 그룹 요약 — '전체'에서 32행을 쏟아내는 대신 평균이 어떻게 만들어졌는지를 보여준다.
   그룹 행을 누르면 그 그룹 탭으로 넘어간다. */
function groupTopIdx(g){          /* 그룹에서 가장 자주 1위로 잡힌 지표 */
  var cnt={},bestName=null,best=0;
  g.rows.forEach(function(r){
    var t=topOf(r.name,1,0);
    if(!t.length)return;
    cnt[t[0][0]]=(cnt[t[0][0]]||0)+1;
    if(cnt[t[0][0]]>best){best=cnt[t[0][0]];bestName=t[0][0]}});
  return bestName?[bestName,best,g.rows.length]:null;
}
/* 요약 행 아래에 펼칠 그룹 상세 — 정렬 머리글은 두지 않는다.
   정렬하면 요약을 다시 그려야 해서 펼친 상태가 풀리기 때문. 정렬이 필요하면 위 탭을 쓴다. */
function groupDetail(g){
  var C=[["종목",1],["6개월",1],["최근",0],["전일비",0],["전월말비",0],["작년말비",0],["가장 닮은 지표",1]];
  var h='<table class="g gsub"><tr>'+C.map(function(c){
    return "<th"+(c[1]?' style="text-align:left"':"")+">"+c[0]+"</th>"}).join("")+"</tr>";
  g.rows.forEach(function(r){h+=rowH(r)});
  return h+"</table>";
}
function renderSummary(){
  var h='<tr><th style="text-align:left">그룹</th><th>종목</th><th>전일비</th><th>전월말비</th>'+
        '<th>작년말비</th><th style="text-align:left">가장 많이 닮은 지표</th></tr>';
  D.groups.forEach(function(g){
    var ti=groupTopIdx(g);
    var tiH=ti?esc(ti[0])+'<span class="nm">'+ti[1]+"/"+ti[2]+"종목</span>":'<span class="dash">—</span>';
    h+='<tr class="gr" data-g="'+esc(g.dna)+'"><td><span class="gmk tk">'+esc(g.label)+"</span></td>"+
       '<td class="dash">'+g.avg.n+"</td><td>"+chgTxt(g.avg.prev)+"</td><td>"+chgTxt(g.avg.mEnd)+
       "</td><td>"+chgTxt(g.avg.yEnd)+"</td>"+
       '<td style="text-align:left;font-size:11.5px;color:var(--ink3)">'+tiH+"</td></tr>";
  });
  var t=D.total;
  h+='<tr class="av"><td>전체</td><td class="dash">'+t.n+"</td><td>"+chgTxt(t.prev)+"</td><td>"+
     chgTxt(t.mEnd)+"</td><td>"+chgTxt(t.yEnd)+"</td><td></td></tr>";
  $("#pf").innerHTML=h;
}
function renderPf(){
  if(GF==="ALL")return renderSummary();
  var C=[["종목",null,1],["6개월",null,1],["최근","last",0],["전일비","0",0],
         ["전월말비","1",0],["작년말비","2",0],["가장 닮은 지표",null,1]];
  var h="<tr>"+C.map(function(c){var k=c[1],
    aw=(k&&SORT===k)?' <span class="aw">'+(SDIR<0?"▼":"▲")+"</span>":"";
    return "<th"+(k?' class="s" data-k="'+k+'"':"")+(c[2]?' style="text-align:left"':"")+">"+c[0]+aw+"</th>"}).join("")+"</tr>";
  D.groups.forEach(function(g){
    if(GF!=="ALL"&&GF!==g.dna)return;

    if(SORT)rows.sort(function(a,b){var x=key(a,SORT),y=key(b,SORT);
      if(x==null)return 1;if(y==null)return -1;return (x-y)*SDIR});
    h+='<tr class="hd"><td colspan="7">'+esc(g.label)+"</td></tr>";
    rows.forEach(function(r){h+=rowH(r)});
    if(g.rows.length>1)h+='<tr class="av"><td>그룹 단순평균</td><td class="spk"></td><td class="dash">'+g.avg.n+
      "종목</td><td>"+chgTxt(g.avg.prev)+"</td><td>"+chgTxt(g.avg.mEnd)+
      "</td><td>"+chgTxt(g.avg.yEnd)+"</td><td></td></tr>"});

function detail(t){var a=topOf(t,8,0);

      '" style="width:'+Math.round(Math.abs(x[1])*100)+'%'+(weak?";opacity:.45":"")+'"></i></span><span class="bv '+
      (weak?"flat":x[1]<0?"neg":"up")+'">'+rTxt(x[1])+"<small>"+(x[1]<0?"반대로 ":"")+rWord(x[1])+"</small></span>"}).join("")+"</div>"}
$("#pf").addEventListener("click",function(ev){

function heatColor(r){if(r==null)return "transparent";
  var a=Math.min(Math.abs(r),1),o=(a*a*0.9).toFixed(3);
  return "rgba("+(r<0?"17,87,207":"236,48,19")+","+o+")"}
/* 히트맵이 32×37이면 정보가 너무 많아 패턴이 안 읽힌다(사용자 지적).
   기본은 성격이 겹치지 않는 '핵심 지표'만 — 칸을 키울 수 있어 세로쓰기 라벨 없이 숫자까지 들어간다.
   전체 지표는 토글로 남겨 둔다. */
var HEAT_ALL=false;
function viewHeat(){
  var core=D.drivers.core||[];
  if(!HEAT_ALL&&core.length)return viewHeatCore(core);
  var ind=D.drivers.indicators;
  if(!ind.length)return '<p class="note">계산된 상관 없음</p>';
  var h='<div class="scroll"><table class="heat">';
  var ig=D.drivers.indGroups||[];
  if(ig.length){h+='<tr><th class="pf"></th>'+ig.map(function(g){
    return '<th class="gb" colspan="'+g[1]+'">'+esc(g[0])+"</th>"}).join("")+"</tr>"}
  h+='<tr><th class="pf"></th>'+
    ind.map(function(n){return '<th class="ind">'+esc(n)+"</th>"}).join("")+"</tr>";
  D.groups.forEach(function(g){
    h+='<tr><th class="gp" colspan="'+(ind.length+1)+'">'+esc(g.label)+"</th></tr>";
    g.rows.forEach(function(r){
      var m=D.drivers.matrix[r.name]||{};
      h+='<tr><th class="pf">'+esc(r.disp||r.name)+"</th>"+ind.map(function(n){
        var v=m[n];
        return '<td style="background:'+heatColor(v)+'" title="'+esc(r.name)+" × "+esc(n)+" = "+
          (v==null?"-":rTxt(v))+'"></td>'}).join("")+"</tr>"})});
  return h+"</table></div>"+
    '<div class="legend"><i style="background:rgba(17,87,207,.9)"></i>−1.0 반대로'+
    '<i style="background:rgba(17,87,207,.25)"></i><i style="background:transparent;border:1px solid var(--rule-soft)"></i>0 무관'+
    '<i style="background:rgba(236,48,19,.25)"></i><i style="background:rgba(236,48,19,.9)"></i>+1.0 똑같이'+
    "&nbsp;&nbsp;색이 진할수록 관계가 뚜렷함 · 칸에 마우스 올리면 정확한 값 표시"+
    '</div><p class="note"><button id="heatTog" class="tog">← 핵심 지표만 보기</button></p>'}

/* 핵심 지표 버전 — 열이 8개뿐이라 머리글을 눕히지 않아도 되고 칸 안에 값을 쓸 수 있다 */
function viewHeatCore(core){

    core.map(function(n){return '<th class="ch">'+esc(n)+"</th>"}).join("")+"</tr>";

    g.rows.forEach(function(r){

      h+='<tr><th class="pf">'+esc(r.disp||r.name)+"</th>"+core.map(function(n){
        var v=m[n],strong=v!=null&&Math.abs(v)>=.55;
        return '<td class="cc" style="background:'+heatColor(v)+';color:'+
          (strong?"#fff":"var(--ink3)")+'">'+(v==null||Math.abs(v)<.2?"":rTxt(v))+"</td>"}).join("")+"</tr>"})});

    '<i style="background:rgba(236,48,19,.25)"></i><i style="background:rgba(236,48,19,.9)"></i>+1.0 똑같이'+

    '<button id="heatTog" class="tog">전체 '+D.drivers.indicators.length+'개 지표 보기 →</button></p>'}
function viewCards(){
  var h='<div class="cards">';

    h+='<div class="card"><div class="ct">'+esc(r.disp||r.name)+'<span class="nm">'+esc(r.alt||"")+"</span></div>";

/* 위로가기 — 이 페이지는 사이트에서 iframe으로 열린다.
   iframe이 자체 스크롤을 가지면 window 스크롤이 잡히고, 부모가 통째로 스크롤하는 구조면
   window는 안 움직인다. 그래서 같은 출처일 때 부모 스크롤도 함께 본다(교차 출처면 조용히 실패). */
(function(){
  var btn=$("#toTop"), par=null;
  try{ if(window.parent&&window.parent!==window&&window.parent.document) par=window.parent; }catch(e){}
  function pos(){
    var y=window.scrollY||0;
    if(par){ try{ y=Math.max(y, par.scrollY||0); }catch(e){} }
    return y;
  }
  function paint(){ btn.classList.toggle("on", pos()>360) }
  btn.onclick=function(){
    window.scrollTo({top:0,behavior:"smooth"});
    if(par){ try{ par.scrollTo({top:0,behavior:"smooth"}); }catch(e){} }
  };
  window.addEventListener("scroll",paint,{passive:true});
  if(par){ try{ par.addEventListener("scroll",paint,{passive:true}); }catch(e){} }
  paint();
})();
