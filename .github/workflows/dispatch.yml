name: 브리핑 깨우기

# 브리핑 다섯을 수동으로 깨우는 레버. 시계는 앱스크립트('브리핑 깨우기' 프로젝트,
# 평일 아침 6~7시 트리거)가 맡는다 — GitHub 의 schedule 은 이 계정에서 비공개·공개
# 모두 안정적으로 뜨지 않았다(9/1~9/2 실측: 슬롯 대부분 누락, 뜨면 30분~3시간 지각).
# 여기 cron 을 되살리면 GAS 와 겹쳐 같은 브리핑이 두 번 발행되니 살리지 말 것.
#
# 필요한 시크릿: ENGINE_TOKEN
#   반드시 fine-grained PAT 로 — Repository access 를 briefing-engine 하나로,
#   Permissions 는 Contents: Read and write 만. (dispatches API 요건)
#
#   계정 전체 권한(classic repo 범위)을 여기 두면 안 된다. 이 저장소에 쓰기 권한이
#   있는 사람은 이 파일을 고쳐 토큰을 빼돌릴 수 있으므로, 토큰이 넓으면 사이트가
#   뚫렸을 때 피해가 계정 전체로 번진다. briefing-engine 하나로 좁혀 두면 거기서 끝난다.

on:
  workflow_dispatch:
    inputs:
      brief:
        description: '깨울 브리핑 (all / econscan / law / morning / ir / portfolio)'
        default: 'all'
        required: false

# 이 잡은 코드를 체크아웃하지도, 이 저장소에 쓰지도 않는다
permissions: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: 어느 브리핑인지 고른다
        id: pick
        env:
          MANUAL: ${{ github.event.inputs.brief }}
        run: |
          t="${MANUAL:-all}"
          case "$t" in
            all|econscan|law|morning|ir|portfolio) ;;
            *) echo "::error::모르는 브리핑 이름: '$t'"; exit 1 ;;
          esac
          echo "target=$t" >> "$GITHUB_OUTPUT"
          echo "깨울 대상: $t"

      - name: briefing-engine 깨우기
        env:
          TOKEN: ${{ secrets.ENGINE_TOKEN }}
          TARGET: ${{ steps.pick.outputs.target }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::ENGINE_TOKEN 시크릿이 없습니다 — briefing-engine 에 쓰기 권한이 있는 PAT 를 넣으세요"
            exit 1
          fi
          if [ "$TARGET" = "all" ]; then
            list="econscan law morning ir portfolio"
          else
            list="$TARGET"
          fi
          fail=0
          for t in $list; do
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/aiofficelab/briefing-engine/dispatches \
              -d "{\"event_type\":\"$t\"}")
            # 204 가 정상. 401/403 은 토큰 권한, 404 는 저장소 이름을 확인할 것
            if [ "$code" = "204" ]; then
              echo "✅ $t 깨움"
            else
              echo "::error::$t 실패 (HTTP $code) $(cat /tmp/resp)"
              fail=1
            fi
            sleep 1
          done
          exit $fail
