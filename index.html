<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Office Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f3f2f2; --ink:#201e1d; --acc:#ec3013; --acc7:#a02008; --mut:#6b6866; --mut2:#8a8683; --line2:#d8d4d3; --tint:#eceae9; }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;background:#fff;color:var(--ink);font-family:'Archivo','Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all;}
  a{color:var(--acc7);} a:hover{color:var(--acc);}
  .wrap{max-width:1060px;margin:0 auto;padding:0 24px;width:100%;}
  .topbar{border-bottom:2px solid var(--ink);}
  .topbar .wrap{padding-top:14px;padding-bottom:14px;font-size:12px;font-weight:700;letter-spacing:3px;}
  /* 상단 바의 주소 = 홈 복귀 버튼. 브리핑을 읽다가 언제든 목록으로 돌아온다 */
  .brandlink{color:var(--acc);text-decoration:none;}
  .brandlink:hover{color:var(--ink);}
  .page{min-height:100vh;display:flex;flex-direction:column;}
  main{flex:1;}
  h1.masthead{margin:36px 0 6px;font-size:56px;line-height:1.02;font-weight:800;letter-spacing:-1.5px;}
  .subdomain{font-size:16px;font-weight:700;letter-spacing:1px;color:var(--mut);}
  .dateline{margin-top:14px;padding-top:0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;}
  .dateline .r{color:var(--mut);}
  .lead{margin-top:26px;border-top:2px solid var(--ink);padding:15px 0 0;display:flex;gap:14px;align-items:baseline;flex-wrap:nowrap;}
  .lead .k{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--acc);white-space:nowrap;}
  /* 전광판: 프레임마다 줄 수가 달라 높이가 출렁이지 않게 항상 한 줄 + 말줄임 */
  .lead .t{font-size:19px;font-weight:700;letter-spacing:-0.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lead .k,.lead .t{transition:opacity .38s ease,transform .38s ease;}
  .lead.sw .k,.lead.sw .t{opacity:0;transform:translateY(5px);}
  .seclabel{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--mut);padding:28px 0 10px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 40px;}
  .cardx{border-top:2px solid var(--ink);padding:16px 0 26px;cursor:pointer;}
  .cardx:hover{background:var(--tint);}
  .cardx.off{cursor:default;}
  .cardx.off:hover{background:transparent;}
  .cardx .head{display:flex;gap:12px;align-items:baseline;}
  .cardx .no{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--acc);}
  .cardx.off .no{color:#9a9694;}
  .cardx .cad{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--mut);}
  .cardx .ttl{padding-top:8px;font-size:22px;font-weight:800;letter-spacing:-0.4px;}
  .cardx.off .ttl{color:#9a9694;}
  .cardx .sum{padding-top:8px;font-size:14px;line-height:1.6;color:#4d4a48;}
  .cardx .meta{padding-top:12px;font-size:12px;color:var(--mut);}
  .cardx .meta b{color:var(--ink);}
  .cardx .meta .go{color:var(--acc7);font-weight:700;}
  .reader{padding-top:24px;}
  .backbtn{appearance:none;border:none;background:transparent;color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;padding:8px 0;cursor:pointer;text-align:left;}
  .backbtn:hover{color:var(--acc7);}
  .rkick{margin-top:14px;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--acc);}
  .rtitle{margin:6px 0 14px;font-size:34px;font-weight:800;letter-spacing:-0.8px;}
  .archive{border-top:2px solid var(--ink);padding:10px 0 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .archive .lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--mut);margin-right:6px;}
  .dsel{appearance:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;
    padding:7px 30px 7px 12px;border:2px solid var(--ink);background:#fff;color:var(--ink);
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
    background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .dsel:hover{border-color:var(--acc);color:var(--acc7);}
  .dnote{font-size:11px;color:var(--mut);}
  .frame-card{border:1px solid var(--line2);background:#fff;margin-bottom:40px;}
  /* 높이를 내용에 맞춰 늘린다(fitFrame) — iframe 자체 스크롤바가 생기지 않게. 창 스크롤 하나만 남는다 */
  iframe{display:block;width:100%;height:600px;border:0;background:#fff;}
  body.reading .frame-card{border:0;background:#fff;margin-bottom:0;}
  /* 지수 스냅샷 — 아침 시황 브리핑이 올리는 market.json 을 읽어 그린다 */
  .snap{margin:26px 0 4px;}
  .snaphead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .snaphead .seclabel{padding-top:8px;}
  .snapat{margin-left:auto;font-size:11px;color:var(--mut);}
  .snapgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    margin-top:10px;border:1px solid var(--line2);}
  .sn{padding:12px 14px 13px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);}
  .sn:nth-child(4n){border-right:0;}
  .sn:nth-last-child(-n+4){border-bottom:0;}
  .sn .l{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mut2);}
  .sn .v{font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-top:3px;line-height:1.1;}
  .sn .c{font-size:12px;font-weight:700;margin-top:2px;}
  .sn .up{color:var(--acc7);} .sn .dn{color:#1a56db;} .sn .fl{color:var(--mut);}
  .sn svg{display:block;width:100%;height:30px;margin-top:8px;}
  .sn svg polyline{fill:none;stroke-width:1.6;}
  .sn svg polygon{opacity:.12;}
  @media (max-width:900px){ .snapgrid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .sn:nth-child(4n){border-right:1px solid var(--line2);}
    .sn:nth-child(2n){border-right:0;}
    .sn:nth-last-child(-n+4){border-bottom:1px solid var(--line2);}
    .sn:nth-last-child(-n+2){border-bottom:0;} }
  .totop{position:fixed;right:20px;bottom:20px;z-index:40;width:42px;height:42px;display:grid;
    place-items:center;background:#fff;color:var(--ink);border:2px solid var(--ink);
    font-size:16px;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s;}
  .totop.on{opacity:1;visibility:visible;}
  .totop:hover{background:var(--acc);border-color:var(--acc);color:#fff;}
  @media (max-width:640px){ .totop{right:12px;bottom:12px;width:38px;height:38px;} }
  .empty{padding:70px 20px;text-align:center;color:var(--mut);font-size:14px;line-height:1.8;}
  .empty b{color:var(--ink);}
  footer{margin-top:auto;background:var(--acc7);}
  footer .wrap{padding-top:22px;padding-bottom:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#fff;}
  footer .b{font-size:13px;font-weight:800;letter-spacing:1px;}
  footer .s{font-size:11px;letter-spacing:0.5px;}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
  @media (max-width:640px){
    h1.masthead{font-size:38px;}
    .lead .t{font-size:16px;}
    /* 모바일에서도 높이는 fitFrame이 정한다 */
  }
</style>
</head>
<body>
<div class="page">
<div class="topbar"><div class="wrap"><a href="#" id="homeLink" class="brandlink">AIOFFICELAB.GITHUB.IO</a></div></div>
<main>
  <section id="home">
    <div class="wrap">
      <h1 class="masthead">AI Office Lab</h1>
      <div class="subdomain">DAILY BRIEFING</div>
      <div class="dateline"><span><b id="today"></b>&nbsp;&nbsp;매일 자동 발행</span>
        <span class="r" id="wx" hidden></span></div>
      <div class="lead" id="lead" hidden><span class="k">오늘 시장 한 줄</span><span class="t" id="leadText"></span></div>
    </div>
    <div class="wrap">
      <div class="snap" id="snap" hidden>
        <div class="snaphead"><span class="seclabel">MARKET SNAPSHOT</span>
          <span class="snapat" id="snapAt"></span></div>
        <div class="snapgrid" id="snapGrid"></div>
      </div>
    </div>
    <div class="wrap">
      <div class="seclabel">DAILY MARKET</div>
      <div class="grid" id="gridMarket"></div>
      <div class="seclabel">NEWS</div>
      <div class="grid" id="gridNews"></div>
      <div class="seclabel">REGULATORY</div>
      <div class="grid" id="gridReg" style="padding-bottom:8px"></div>
    </div>
  </section>
  <section id="reader" class="wrap reader" hidden>
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><button class="backbtn" id="back">← 전체 브리핑</button><button class="backbtn" id="next" hidden></button></div>
    <div class="rkick" id="rkick"></div>
    <h1 class="rtitle" id="rtitle"></h1>
    <div class="archive"><span class="lbl">아카이브</span>
      <select id="dates" class="dsel" aria-label="회차 선택"></select>
      <span class="dnote" id="dnote"></span></div>
    <div class="frame-card">
      <div class="empty" id="empty" hidden><b>아직 발행된 브리핑이 없습니다.</b><br>발행이 시작되면 자동으로 올라옵니다.</div>
      <iframe id="frame" title="브리핑 본문" hidden></iframe>
    </div>
  </section>
</main>
<button class="totop" id="totop" type="button" aria-label="맨 위로">↑</button>
<footer><div class="wrap"><span class="b">AI OFFICE LAB</span><span class="s">자동 생성 브리핑 · 투자 권유가 아닙니다 · 매일 아침 발행</span></div></footer>
</div>
<script>
var BRIEFS = [
  /* 앱스크립트의 '아침 시황'과 '경제 & 리스크' 브리핑을 합친 것 — 2026-08-30.
     지난 회차는 econrisk kind 에 남아 있으나 카드는 없앴다. */
  { kind:"morning",  group:"market", no:"01", cad:"매일 오전 7시 · 오후 4시", title:"시황 브리핑", kick:"MARKET BRIEFING", sum:"환율·증시·금리·원자재 + 오늘의 흐름 · 금융스트레스" },
  { kind:"ir",       group:"market", no:"02", cad:"매일 아침 7시", title:"IR 캘린더", kick:"GLOBAL IR CALENDAR", sum:"실적발표 캘린더 · 주간 실적 리뷰" },
  /* weekly(MY 포트폴리오 대시보드) + finstats(주요 금융 통계) 통합 — 2026-08-30.
     시장 지표를 붙여둔 이유가 "내 종목이 어떤 지표를 따라 움직이나"였는데 둘이 떨어져 있어 그 연결을 볼 수 없었다.
     지난 회차는 아래 두 kind에 그대로 남아 있어 예전 날짜를 고르면 계속 열린다. */
  { kind:"dart",     group:"market", no:"03", cad:"매일 아침 7시", title:"기업공시 감시", kick:"CORPORATE DISCLOSURE WATCH", sum:"국내 60사 + 미국 70사 적신호 분류" },
  { kind:"rates",    group:"market", no:"04", cad:"매주 월요일 아침", title:"주간 금리 동향", kick:"WEEKLY RATES", sum:"한국·미국 국채 금리 · 한미 금리차 · 원/달러" },
  { kind:"econscan", group:"market", no:"05", cad:"매일 아침 7시", title:"경제·금융 동향", kick:"DAILY SCAN", sum:"재경부 경제지표 + 금감원 금융시장 동향 — 일일/주간/월간" },
  { kind:"portfolio", group:"market", no:"06", cad:"매일 아침 7시", title:"관심종목 리포트", kick:"WATCHLIST REPORT", sum:"관심종목 32개 + 시장 지표" },
  { kind:"ktnews",   group:"news",   no:"07", cad:"매일 아침 7시", title:"KT그룹 뉴스", kick:"KT GROUP NEWS", sum:"KT 리스크 · 그룹사 42사 · 통신3사 — 오탐 차단 스크랩" },
  { kind:"tech",     group:"news",   no:"08", cad:"매일 아침 7시", title:"빅테크·AI 동향", kick:"BIG TECH & AI", sum:"빅테크 8사 — 회사별 AI 요약 리포트" },
  { kind:"rnd",      group:"news",   no:"09", cad:"매일 아침 7시", title:"기술 리포트", kick:"TECH REPORTS", sum:"SPRi·KISTEP 새 간행물 + 기술 정보 사이트 바로가기" },
  { kind:"fss",      group:"reg",    no:"10", cad:"매일 아침 7시", title:"금감원 회계감독", kick:"FSS ACCOUNTING WATCH", sum:"감리제재 · 지적사례 · 내부회계 · IFRS · 세칙 제·개정" },
  { kind:"law",      group:"reg",    no:"11", cad:"매일 아침 7시", title:"법률 모니터링", kick:"WEEKLY REGULATORY MONITOR", sum:"입법예고 · 국회 심사 · 금융위 모니터링" }
];
var state = { kind:null, date:null, manifest:{} };
var frameRO = null;

/* iframe 높이를 내용 높이에 맞춘다 — 프레임 자체 스크롤바를 없애고 창 스크롤 하나만 남긴다 */
var fitting = false;
function fitFrame(){
  if (fitting) return;                 /* 관찰 → 조정 → 관찰 루프 차단 */
  fitting = true;
  requestAnimationFrame(function(){
    try{
      var f = $("frame"), doc = f && f.contentDocument;
      if (!doc || !doc.body) { fitting = false; return; }
      /* body 만 잰다. documentElement 는 프레임을 채우도록 늘어나므로 현재 높이를
         그대로 돌려주고, 그러면 한 번 커진 높이가 줄지 않는다.
         반대로 재기 전에 프레임을 접으면 문서가 짧아진 순간 창 스크롤이
         맨 위로 당겨진다 — 모바일에서 주소창 때문에 resize 가 잦아 특히 심하다. */
      var b = doc.body, cs = doc.defaultView.getComputedStyle(b);
      var h = Math.max(b.scrollHeight, b.getBoundingClientRect().height) +
              (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
      h = h > 0 ? Math.ceil(h) + 2 : 600;
      if (Math.abs(h - (parseFloat(f.style.height) || 0)) > 1) f.style.height = h + "px";
    } catch(e){}
    fitting = false;
  });
}

/* 세로 크기 변화(모바일 주소창 접힘)로는 다시 재지 않는다 — 스크롤 중 흔들림의 원인 */
var lastW = window.innerWidth;
window.addEventListener("resize", function(){
  if (window.innerWidth === lastW) return;
  lastW = window.innerWidth;
  fitFrame();
});

/* 맨 위로 — 브리핑이 통째로 펼쳐져 창 스크롤이 길어지므로 부모에 둔다 */
(function(){
  var b = document.getElementById("totop");
  if (!b) return;
  function paint(){ b.classList.toggle("on", (window.scrollY || 0) > 360); }
  b.addEventListener("click", function(){ window.scrollTo({ top:0, behavior:"smooth" }); });
  window.addEventListener("scroll", paint, { passive:true });
  paint();
})();
var $ = function(id){ return document.getElementById(id); };

var d = new Date();
$("today").textContent = d.getFullYear() + "." + (d.getMonth()+1) + "." + d.getDate() + "(" + "일월화수목금토"[d.getDay()] + ")";

fetch("manifest.json", { cache:"no-store" })
  .then(function(r){ return r.ok ? r.json() : {}; })
  .then(function(m){ state.manifest = m || {}; renderHome(); route(); })
  .catch(function(){ renderHome(); });

/* 주요 지수 스냅샷 — 아침 시황 브리핑이 발행할 때 함께 올리는 market.json.
   브리핑 HTML을 파싱하는 대신 작은 JSON 하나를 읽는다(발행 쪽이 바뀌어도 홈이 안 깨짐).
   서버는 30분마다 갱신하지만 열려 있는 탭은 스스로 다시 불러오지 않으면 옛 화면에
   머문다 — 5분마다, 그리고 탭으로 돌아올 때 다시 읽는다. */
function loadSnap(){
fetch("market.json", { cache:"no-store" })
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(m){
    if (!m || !m.items || !m.items.length) return;
    $("snapAt").textContent = m.at ? m.at + " 기준" : "";
    $("snapGrid").innerHTML = m.items.map(function(it){
      var up = (it.pct || 0) >= 0, cls = it.pct == null ? "fl" : (it.pct > 0 ? "up" : it.pct < 0 ? "dn" : "fl");
      var arrow = it.pct == null ? "" : (it.pct > 0 ? "▲ " : it.pct < 0 ? "▼ " : "― ");
      var val = Number(it.last).toLocaleString("ko-KR",
        { minimumFractionDigits: it.d, maximumFractionDigits: it.d }) + (it.rate ? "%" : "");
      var pct = it.pct == null ? "—" : (it.pct > 0 ? "+" : "") + it.pct.toFixed(2) + "%";
      var sp = "";
      if (it.spark && it.spark.length > 4) {
        var st = 100 / (it.spark.length - 1);
        var pts = it.spark.map(function(v, i){ return (i*st).toFixed(1) + "," + (28 - v/100*26).toFixed(1); }).join(" ");
        var col = up ? "var(--acc)" : "#1a56db";
        sp = '<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">' +
             '<polygon points="0,30 ' + pts + ' 100,30" fill="' + col + '"/>' +
             '<polyline points="' + pts + '" stroke="' + col + '"/></svg>';
      }
      return '<div class="sn"><div class="l">' + it.label + '</div>' +
             '<div class="v">' + val + '</div>' +
             '<div class="c ' + cls + '">' + arrow + pct + '</div>' + sp + '</div>';
    }).join("");
    $("snap").hidden = false;
  })
  .catch(function(){});
}

/* 서울(광화문) 날씨 — 마켓 스냅샷이 30분마다 weather.json으로 올린다 */
function loadWx(){
fetch("weather.json", { cache:"no-store" })
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(w){
    if (!w || w.temp == null) return;
    var c = w.code, icon =
      c === 0 ? "☀️" : c <= 2 ? "🌤️" : c === 3 ? "☁️" : c <= 48 ? "🌫️" :
      c <= 57 ? "🌦️" : c <= 67 ? "🌧️" : c <= 77 ? "❄️" : c <= 82 ? "🌧️" :
      c <= 86 ? "🌨️" : "⛈️";
    var t = icon + " " + (w.city || "서울") + " " + Math.round(w.temp) + "°";
    if (w.tmin != null && w.tmax != null) t += " · " + Math.round(w.tmin) + "°/" + Math.round(w.tmax) + "°";
    if (w.pop != null && w.pop > 0) t += " · 강수 " + w.pop + "%";
    $("wx").textContent = t;
    $("wx").hidden = false;
  })
  .catch(function(){});
}

/* '오늘 시장 한 줄' 자리는 전광판 — 시장 한 줄 → 빅테크·KT 최신 뉴스 → 오늘 발행 현황이
   6초마다 돌아간다. 뉴스 줄은 기사 원문(새 탭), 나머지는 해당 게시판으로 이동. */
var tick = { frames: [], i: 0 };
function jget(u){ return fetch(u, { cache:"no-store" }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }); }

function todayIso(){
  var d = new Date(), p = function(n){ return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function buildFrames(lead, tech, kt, rnd){
  var fr = [];
  if (lead && lead.text) {
    var lk = lead.ed === "pm" ? "오후 시장 한 줄" : (lead.ed === "am" ? "오전 시장 한 줄" : "오늘 시장 한 줄");
    fr.push({ k: lk, t: lead.text, kind: "morning" });
  }
  /* 클릭하면 기사 원문이 아니라 해당 게시판으로 들어간다 — 카드 순서와 같게 KT 먼저 */
  ((kt && kt.items) || []).slice(0, 3).forEach(function(a){ fr.push({ k: "KT그룹 뉴스", t: a.t, kind: "ktnews" }); });
  ((tech && tech.items) || []).slice(0, 3).forEach(function(a){ fr.push({ k: "빅테크·AI", t: a.t, kind: "tech" }); });
  ((rnd && rnd.items) || []).slice(0, 1).forEach(function(a){ fr.push({ k: "새 간행물", t: a.t, kind: "rnd" }); });
  var td = todayIso(), fresh = BRIEFS.filter(function(b){
    var ds = state.manifest[b.kind] || [];
    return ds.length && String(ds[0]).indexOf(td) === 0;
  }).map(function(b){ return b.title; });
  if (fresh.length) {
    var t = fresh.slice(0, 3).join(" · ") + (fresh.length > 3 ? " 외 " + (fresh.length - 3) + "종" : "");
    fr.push({ k: "오늘 발행 " + fresh.length + "종", t: t });
  }
  return fr;
}

function setFrame(f){
  var el = $("lead");
  document.querySelector("#lead .k").textContent = f.k;
  $("leadText").textContent = f.t;
  el.dataset.href = f.href || ""; el.dataset.kind = f.kind || "";
  el.style.cursor = (f.href || f.kind) ? "pointer" : "default";
}

function showFrame(){
  if (!tick.frames.length) return;
  var f = tick.frames[tick.i % tick.frames.length], el = $("lead");
  if (el.hidden) { setFrame(f); el.hidden = false; return; }
  el.classList.add("sw");                       /* 내려가며 사라진 뒤 */
  setTimeout(function(){
    setFrame(f);                                /* 안 보일 때 글자를 갈고 */
    el.classList.remove("sw");                  /* 제자리로 떠오른다 */
  }, 390);
}

$("lead").addEventListener("click", function(){
  var h = this.dataset.href, k = this.dataset.kind;
  if (h) window.open(h, "_blank", "noopener");
  else if (k && (state.manifest[k] || []).length) openReader(k);
});
setInterval(function(){
  if (tick.frames.length > 1) { tick.i++; showFrame(); }
}, 6000);

function loadLead(){
  Promise.all([jget("lead.json"), jget("briefs/tech/feed.json"),
               jget("briefs/ktnews/feed.json"), jget("briefs/rnd/feed.json")])
    .then(function(rs){
      var had = tick.frames.length;
      tick.frames = buildFrames(rs[0], rs[1], rs[2], rs[3]);
      if (tick.frames.length && !had) showFrame();   /* 재조회 때는 회전 리듬 유지 */
    });
}

function refreshLive(){ loadSnap(); loadWx(); loadLead(); }
refreshLive();
setInterval(refreshLive, 5 * 60 * 1000);            /* 5분마다 */
document.addEventListener("visibilitychange", function(){
  if (!document.hidden) refreshLive();              /* 탭으로 돌아오면 즉시 */
});

function dates(kind){ return state.manifest[kind] || []; }

/* 하루 두 판 회차 키(2026-09-05-am/-pm)를 사람 말로 — 옛 키(날짜만)는 그대로 */
function prettyDate(dd){
  return String(dd).replace(/-am$/, " 오전").replace(/-pm$/, " 오후");
}

function renderHome(){
  ["gridMarket","gridNews","gridReg"].forEach(function(id){ $(id).innerHTML = ""; });
  BRIEFS.forEach(function(b){
    var ds = dates(b.kind), has = ds.length > 0;
    var el = document.createElement("div");
    el.className = "cardx" + (has ? "" : " off");
    el.innerHTML =
      '<div class="head"><span class="no">' + b.no + '</span><span class="cad">' + (has ? b.cad : "준비 중") + '</span></div>' +
      '<div class="ttl">' + b.title + '</div>' +
      '<div class="sum">' + b.sum + '</div>' +
      (has ? '<div class="meta">최신 <b>' + prettyDate(ds[0]) + '</b> &nbsp;·&nbsp; <span class="go">브리핑 열기 →</span></div>' : '');
    if (has) el.addEventListener("click", function(){ openReader(b.kind); });
    $(b.group === "market" ? "gridMarket" : b.group === "news" ? "gridNews" : "gridReg").appendChild(el);
  });
}

/* 딥링크 — aiofficelab.github.io/#rates 처럼 브리핑으로 바로 들어온다.
   카드를 열면 주소창도 #kind 로 바뀌어 그대로 복사·즐겨찾기할 수 있다. */
function route(){
  var kind = (location.hash || "").replace("#", "");
  var known = BRIEFS.some(function(b){ return b.kind === kind; });
  if (known && dates(kind).length) {
    if (state.kind !== kind || $("reader").hidden) openReader(kind, true);
  } else if (!$("reader").hidden) {
    document.body.classList.remove("reading");
    $("reader").hidden = true; $("home").hidden = false;
  }
}
window.addEventListener("hashchange", route);

function openReader(kind, fromRoute){
  if (!fromRoute && location.hash !== "#" + kind) {
    history.pushState(null, "", "#" + kind);   /* 브라우저 뒤로가기 = 허브로 */
  }
  document.body.classList.add("reading");
  state.kind = kind; state.date = dates(kind)[0] || null;
  $("home").hidden = true; $("reader").hidden = false;
  var b = BRIEFS.filter(function(x){ return x.kind === kind; })[0];
  $("rkick").textContent = b.kick + " · " + b.cad;
  $("rtitle").textContent = b.title;
  var nb = nextBrief(kind);
  if (nb) {
    $("next").hidden = false;
    $("next").textContent = "다음: " + nb.title + " →";
    $("next").onclick = function(){ openReader(nb.kind); };
  } else {
    $("next").hidden = true;
  }
  renderReader();
  window.scrollTo(0, 0);
}

function nextBrief(kind){
  var idx = -1;
  BRIEFS.forEach(function(b, i){ if (b.kind === kind) idx = i; });
  for (var i = 1; i < BRIEFS.length; i++) {
    var b = BRIEFS[(idx + i) % BRIEFS.length];
    if (dates(b.kind).length) return b;
  }
  return null;
}

$("homeLink").addEventListener("click", function(ev){
  ev.preventDefault();
  if (!$("reader").hidden) { $("back").click(); }
  window.scrollTo({ top:0, behavior:"smooth" });
});

$("back").addEventListener("click", function(){
  document.body.classList.remove("reading");
  $("reader").hidden = true; $("home").hidden = false;
  if (location.hash) history.pushState(null, "", location.pathname + location.search);
});

function renderReader(){
  /* 회차는 최신이 위. manifest 가 unshift 로 쌓아 이미 내림차순이지만 한 번 더 정렬해 둔다 */
  var ds = dates(state.kind).slice().sort().reverse(), sel = $("dates");
  sel.innerHTML = "";
  ds.forEach(function(dd, i){
    var op = document.createElement("option");
    op.value = dd;
    op.textContent = prettyDate(dd) + (i === 0 ? "  (최신)" : "");
    if (dd === state.date) op.selected = true;
    sel.appendChild(op);
  });
  sel.onchange = function(){ state.date = this.value; renderReader(); };
  $("dnote").textContent = ds.length > 1 ? "전체 " + ds.length + "회차" : "";
  if (!state.date) { $("frame").hidden = true; $("empty").hidden = false; return; }
  $("empty").hidden = true;
  var f = $("frame");
  f.hidden = false;
  f.onload = function(){
    try {
      var doc = f.contentDocument;
      var base = doc.createElement("base");
      base.target = "_blank";
      var head = doc.head || doc.documentElement;
      head.insertBefore(base, head.firstChild);
      mobilize(doc);
      fitFrame();
      try{
        if (window.ResizeObserver) {
          if (frameRO) frameRO.disconnect();
          /* body 만 관찰한다. documentElement 는 프레임 높이를 따라 커지므로
             함께 관찰하면 '높이 조정 → 관찰 → 다시 조정' 이 되먹임으로 돈다. */
          frameRO = new ResizeObserver(fitFrame);
          frameRO.observe(doc.body);
        }
      } catch(e){}
    } catch(e){}
  };
  /* 재발행분이 캐시에 가려지지 않게 ?v= 부여. src 대입 대신 location.replace —
     iframe 이동이 브라우저 히스토리에 쌓이면 뒤로가기가 프레임의 빈 문서로
     빠지며 막힌다(제목만 남고 아래가 백지가 되던 그 증상). */
  var src = "briefs/" + state.kind + "/" + state.date + ".html?v=" + Date.now();
  try { f.contentWindow.location.replace(src); }
  catch (e) { f.src = src; }
}

/* 이메일용 고정폭 브리핑을 좁은 화면에 맞게 풀어준다 (원본 index.html 로직 유지) */
function mobilize(doc){
  if (!doc || window.innerWidth >= 640) return;
  doc.querySelectorAll("table").forEach(function(t){
    var w = parseInt(t.getAttribute("width"), 10) ||
            parseInt((t.style.width || "").replace("px",""), 10) || 0;
    if (w >= 480) {
      t.style.setProperty("width","100%","important");
      t.style.setProperty("max-width", w + "px","important");
      t.removeAttribute("width");
    }
  });
  doc.querySelectorAll("th[width], td[width]").forEach(function(c){
    if (parseInt(c.getAttribute("width"), 10) >= 30) c.removeAttribute("width");
  });
  var st = doc.createElement("style");
  st.textContent =
    "html,body{overflow-x:hidden;word-break:keep-all;" +
    "-webkit-text-size-adjust:100% !important;text-size-adjust:100% !important;}" +
    "img{max-width:100%;height:auto;}" +
    "td,th{white-space:normal !important;}" +
    "td span{max-width:100% !important;word-break:break-all !important;" +
    "white-space:normal !important;box-sizing:border-box;}";
  (doc.head || doc.documentElement).appendChild(st);
}
</script>
</body>
