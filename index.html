<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Office Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Modernist 토큰 — 흰 바탕, 잉크, 빨간 강조 하나. 상승 빨강 · 하락 파랑 */
  :root{ --bg:#fff; --ink:#201e1d; --acc:#ec3013; --acc6:#dd2b0f; --acc7:#ae1800; --acc1:#fff2ef; --acc8:#7c1405;
    --dn:#1157cf; --dn7:#0b3d96; --dn1:#eef3fd;
    --n2:#eae7e7; --n3:#d7d3d3; --n5:#9b9797; --n6:#7d7979; --n7:#605d5d; --n8:#444141;
    --div:rgba(32,30,29,.4); --font:'Archivo','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font);word-break:keep-all;text-wrap:pretty;}
  a{color:var(--acc7);} a:hover{color:var(--acc);}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
  ::selection{background:rgba(236,48,19,.3);}
  .page{min-height:100vh;display:flex;flex-direction:column;}
  main{flex:1;}
  .edge{padding-left:clamp(16px,3vw,40px);padding-right:clamp(16px,3vw,40px);}
  .kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--acc7);}
  .tnum{font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums;}

  /* 상단 바 */
  .top{display:flex;align-items:center;gap:6px 20px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px;}
  .brand{font-size:18px;font-weight:800;letter-spacing:-.01em;color:inherit;text-decoration:none;margin-right:auto;}
  .brand:hover{color:var(--acc);}
  .top .meta{font-size:13px;color:var(--n8);display:inline-flex;align-items:center;gap:6px;}
  .top svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* 메뉴 — 오늘 + 3개 분류. 분류에 커서를 올리면 아래로 게시판 목록이 펼쳐진다 */
  .menu{position:relative;z-index:30;border-top:2px solid var(--div);border-bottom:2px solid var(--div);}
  .tabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:clamp(4px,2vw,24px);}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{appearance:none;border:0;background:transparent;font:inherit;font-size:15px;font-weight:700;color:var(--n7);
    padding:14px 12px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .tab:first-child{padding-left:0;gap:8px;}
  .tab:hover,.tab.hov{color:var(--acc7);}
  .tab.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--acc);}
  .tab .cnt{font-size:12px;font-weight:600;color:var(--n6);}
  .tab .sq{display:inline-block;width:8px;height:8px;background:var(--acc);}
  .tab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;}
  .tab.hov svg{transform:rotate(180deg);}
  .mega{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:2px solid var(--div);box-shadow:0 3px 10px rgba(45,43,43,.16);padding:20px clamp(16px,3vw,40px) 24px;}
  .mega .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px;background:var(--div);border:2px solid var(--div);}
  .mega .col{background:var(--bg);padding:14px 18px 10px;}
  .mega .col>*{transition:opacity .15s;}
  .mega .col.dim>*{opacity:.55;}
  .mega .col .h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--acc7);padding-bottom:8px;border-bottom:1px solid var(--n3);}
  .mega .col a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--n3);color:inherit;text-decoration:none;}
  .mega .col a:hover{color:var(--acc7);}
  .mega .col a.off{opacity:.45;pointer-events:none;}
  .mega .col a .no{font-size:12px;font-weight:800;color:var(--acc);}
  .mega .col a .t{font-size:15px;font-weight:500;}
  .mega .col a.on .t{font-weight:800;}
  .mega .col a .d{font-size:11px;font-weight:600;color:var(--n6);}
  .mega .col a .d.fresh{color:var(--acc7);}

  /* 홈 보드 */
  #home{padding-top:clamp(16px,3vw,40px);padding-bottom:48px;display:flex;flex-direction:column;gap:clamp(16px,2vw,28px);}
  .poster{display:flex;flex-wrap:wrap;gap:2px;background:var(--div);border:2px solid var(--div);}
  .poster .lead{flex:2 1 420px;min-width:0;background:var(--acc1);color:var(--ink);padding:clamp(20px,3vw,40px);
    display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:240px;cursor:pointer;}
  .poster .lead .k{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
  .poster .lead .k{color:var(--acc7);}
  .poster .lead .k .at{font-weight:400;letter-spacing:.02em;text-transform:none;color:var(--n7);}
  .poster .lead h1{margin:0 0 0 -.03em;font-size:clamp(28px,4.4vw,56px);line-height:1.06;letter-spacing:-.02em;font-weight:800;max-width:20ch;}
  .poster .lead .k,.poster .lead h1{transition:opacity .3s ease,transform .3s ease;}
  .poster .lead.sw .k,.poster .lead.sw h1{opacity:0;transform:translateY(6px);}
  .poster .lead .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
  /* 좌우 넘기기 — 커서를 올리면(또는 터치 기기에선 항상) 보인다 */
  .ctl{margin-left:auto;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .15s;}
  .poster .lead:hover .ctl,.poster .lead:focus-within .ctl,.wirebox:hover .ctl,.wirebox:focus-within .ctl{opacity:1;}
  @media (hover:none){ .ctl{opacity:1;} }
  .ctl .pos{font-size:12px;font-weight:600;margin-right:6px;}
  .ctl button{width:36px;height:36px;padding:0;justify-content:center;}
  .ghost.ico{width:36px;height:36px;padding:0;justify-content:center;}
  .wirebox{flex:1 1 280px;min-width:0;background:var(--bg);padding:clamp(18px,2.4vw,28px) clamp(20px,3vw,32px) clamp(16px,2vw,24px);display:flex;flex-direction:column;}
  .wirebox .hd{display:flex;align-items:baseline;gap:10px;}
  .wirebox .hd .pos{margin-left:auto;font-size:12px;color:var(--n6);}
  .wirebox .list{margin-top:6px;transition:opacity .25s ease;}
  .wirebox.sw .list{opacity:0;}
  .wirebox .list a{display:block;padding:9px 0;border-bottom:1px solid var(--n3);color:inherit;text-decoration:none;}
  .wirebox .list a:hover{color:var(--acc7);}
  .wirebox .list .src{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--n6);}
  .wirebox .list .t{font-size:14px;line-height:1.45;font-weight:600;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .wirebox .ft{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--n7);}
  .wirebox .ft .ctl{margin-left:auto;}
  .ghost{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:800;color:#fff;background:var(--acc);
    border:1px solid var(--acc);padding:9px 14px;cursor:pointer;text-decoration:none;}
  .ghost:hover{background:var(--acc6);border-color:var(--acc6);color:#fff;}
  .ghost.ico{color:var(--ink);background:transparent;border-color:var(--div);}
  .ghost.ico:hover{background:#ffe0d9;border-color:var(--ink);color:var(--ink);}
  .ctl .pos{color:var(--n7);}
  .ghost svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  /* 발행 현황 — 타일 격자의 12번째 칸 */
  .status{background:var(--bg);padding:18px 20px 16px;min-height:150px;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .status .big{display:flex;align-items:baseline;gap:8px;margin-top:4px;}
  .status .big b{font-size:36px;line-height:1;font-weight:800;letter-spacing:-.03em;}
  .status .big span{font-size:14px;font-weight:600;color:var(--n7);}
  .status p{margin:auto 0 0;padding-top:16px;font-size:12px;color:var(--n7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* 마켓 스냅샷 — 항목 수로 나눠지는 열 수를 JS가 고른다(빈 칸 없이 꽉 찬 격자) */
  .snap{display:grid;gap:1px;background:var(--div);border:1px solid var(--div);grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));}
  .sn{background:var(--bg);padding:12px 14px 10px;display:flex;flex-direction:column;min-width:0;}
  .sn .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--n7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sn .v{font-size:19px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-top:5px;}
  .sn .c{font-size:12px;font-weight:600;margin-top:2px;}
  .sn .up{color:var(--acc);} .sn .dn{color:var(--dn);} .sn .fl{color:var(--n6);}
  .sn svg{display:block;width:100%;height:20px;margin-top:8px;}
  .sn svg polyline{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke;}
  .sn svg polygon{opacity:.14;}

  /* 브리핑 타일 격자 + 뉴스 와이어 */
  .tiles{display:grid;gap:2px;background:var(--div);border:2px solid var(--div);grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));}
  .tile{background:var(--bg);padding:18px 20px 16px;min-height:150px;display:flex;flex-direction:column;gap:6px;color:inherit;text-decoration:none;min-width:0;}
  .tile:hover{background:var(--n2);color:inherit;}
  .tile.off{cursor:default;} .tile.off:hover{background:var(--bg);}
  .tile .hd{display:flex;align-items:baseline;gap:10px;}
  .tile .hd .no{font-size:24px;line-height:1;font-weight:800;color:var(--acc);letter-spacing:-.02em;}
  .tile.off .hd .no{color:var(--n5);}
  .tile .hd .cad{margin-left:auto;font-size:12px;color:var(--n6);}
  .tile .ttl{font-size:20px;line-height:1.2;font-weight:800;letter-spacing:-.015em;margin-top:8px;}
  .tile.off .ttl{color:var(--n5);}
  .tile .ft{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--n7);}
  .tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;font-weight:600;}
  .tag.acc{background:var(--acc1);color:var(--acc8);} .tag.neu{background:#f8f4f4;color:var(--n8);}
  .tile .go{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink);}
  .tile .go svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* 리더 */
  #reader{padding-top:clamp(16px,3vw,40px);padding-bottom:48px;}
  .rhead{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;padding-bottom:20px;}
  .rhead .tt{flex:1 1 300px;min-width:0;}
  .rhead h1{margin:8px 0 0 -.03em;font-size:clamp(28px,4vw,48px);line-height:1.06;letter-spacing:-.02em;font-weight:800;}
  .rhead .rsum{margin-top:8px;font-size:14px;color:var(--n7);}
  .rctl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .rctl label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--n7);min-width:220px;white-space:nowrap;}
  .dsel{appearance:none;width:100%;min-height:36px;padding:6px 32px 6px 10px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;
    background:var(--n2) no-repeat right 12px center;border:1px solid var(--div);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23201e1d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");}
  .dsel:hover{border-color:var(--ink);}
  .btn2{display:inline-flex;align-items:center;gap:6px;min-height:36px;font:inherit;font-size:14px;font-weight:800;color:var(--ink);background:transparent;
    border:1px solid var(--div);padding:8px 14px;cursor:pointer;}
  .btn2:hover{background:rgba(32,30,29,.07);}
  .btn2 svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .frame-card{background:var(--bg);}
  /* 높이를 내용에 맞춰 늘린다(fitFrame) — 창 스크롤 하나만 남는다 */
  iframe{display:block;width:100%;height:600px;border:0;background:var(--bg);}
  .empty{padding:48px 0;color:var(--n7);font-size:14px;line-height:1.7;border-top:2px solid var(--div);}
  .empty b{color:var(--ink);}

  /* 맨 위로 */
  .totop{position:fixed;right:20px;bottom:20px;z-index:40;width:44px;height:44px;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    border:2px solid var(--ink);cursor:pointer;opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s;}
  .totop.on{opacity:1;visibility:visible;}
  .totop:hover{background:var(--acc);border-color:var(--acc);color:#fff;}
  .totop svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  @media (max-width:640px){ .totop{right:12px;bottom:12px;} }

  footer{margin-top:auto;border-top:2px solid var(--div);padding-top:16px;padding-bottom:16px;display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13px;color:var(--n7);}
  footer .r{margin-left:auto;}
</style>
</head>
<body>
<div class="page">
<div class="top edge">
  <a href="#" id="homeLink" class="brand">AI Office Lab</a>
  <span class="meta tnum" id="today"></span>
  <span class="meta" id="wx" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg><span id="wxText"></span></span>
</div>
<nav class="menu" id="menu" aria-label="브리핑"><div class="tabs edge" id="tabs"></div><div class="mega" id="mega" hidden><div class="cols" id="megaCols"></div></div></nav>
<main>
  <section id="home" class="edge">
    <div class="poster">
      <div class="lead" id="lead">
        <div class="k"><span id="leadK">오늘 시장 한 줄</span><span class="at tnum" id="snapAt"></span></div>
        <h1 id="leadText">브리핑을 불러오는 중…</h1>
        <div class="row">
          <button class="ghost" id="leadGo" type="button">시황 브리핑 열기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
          <div class="ctl" id="leadCtl" hidden><span class="pos tnum" id="leadPos"></span>
            <button class="ghost ico" type="button" id="leadPrev" aria-label="이전"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="ghost ico" type="button" id="leadNext" aria-label="다음"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
        </div>
      </div>
      <div class="wirebox" id="wirebox">
        <div class="hd"><span class="kick">뉴스 와이어</span><span class="pos tnum" id="wirePos"></span></div>
        <div class="list" id="wireList"></div>
        <div class="ft"><span>KT그룹 · 빅테크·AI · 새 간행물</span>
          <div class="ctl"><button class="btn2" type="button" id="wirePrev" aria-label="이전"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="btn2" type="button" id="wireNext" aria-label="다음"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
        </div>
      </div>
    </div>
    <div class="snap tnum" id="snapGrid" hidden></div>
    <div class="tiles" id="tiles"></div>
  </section>
  <section id="reader" class="edge" hidden>
    <div class="rhead">
      <div class="tt"><div class="kick" id="rkick"></div><h1 id="rtitle"></h1><div class="rsum" id="rsum"></div></div>
      <div class="rctl">
        <label><span>아카이브 · <span id="dnote"></span></span><select id="dates" class="dsel" aria-label="회차 선택"></select></label>
        <button class="btn2" id="next" type="button" hidden></button>
      </div>
    </div>
    <div class="frame-card">
      <div class="empty" id="empty" hidden><b>아직 발행된 브리핑이 없습니다.</b><br>발행이 시작되면 자동으로 올라옵니다.</div>
      <iframe id="frame" title="브리핑 본문" hidden></iframe>
    </div>
  </section>
</main>
<button class="totop" id="totop" type="button" aria-label="맨 위로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
<footer class="edge"><span>자동 생성 브리핑 · 투자 권유가 아닙니다</span><span class="r">AI Office Lab · Daily Briefing</span></footer>
</div>
<script>
var BRIEFS = [
  { kind:"morning",  group:"market", no:"01", cad:"매일 오전 7시 · 오후 4시", title:"시황 브리핑", kick:"MARKET BRIEFING", sum:"환율·증시·금리·원자재 + 오늘의 흐름 · 금융스트레스" },
  { kind:"ir",       group:"market", no:"02", cad:"매일 아침 7시", title:"IR 캘린더", kick:"GLOBAL IR CALENDAR", sum:"실적발표 캘린더 · 주간 실적 리뷰" },
  { kind:"dart",     group:"market", no:"03", cad:"매일 아침 7시", title:"기업공시 감시", kick:"CORPORATE DISCLOSURE WATCH", sum:"국내 60사 + 미국 70사 적신호 분류" },
  { kind:"rates",    group:"market", no:"04", cad:"매주 월요일 아침", title:"주간 금리 동향", kick:"WEEKLY RATES", sum:"한국·미국 국채 금리 · 한미 금리차 · 원/달러" },
  { kind:"econscan", group:"market", no:"05", cad:"매일 아침 7시", title:"경제·금융 동향", kick:"DAILY SCAN", sum:"재경부 경제지표 + 금감원 금융시장 동향 — 일일/주간/월간" },
  { kind:"portfolio", group:"market", no:"06", cad:"매일 아침 7시", title:"관심종목 리포트", kick:"WATCHLIST REPORT", sum:"관심종목 32개 + 시장 지표" },
  { kind:"ktnews",   group:"news",   no:"07", cad:"매일 아침 7시", title:"KT그룹 뉴스", kick:"KT GROUP NEWS", sum:"KT 리스크 · 그룹사 42사 · 통신3사 — 오탐 차단 스크랩" },
  { kind:"tech",     group:"news",   no:"08", cad:"매일 아침 7시", title:"빅테크·AI 동향", kick:"BIG TECH & AI", sum:"빅테크 8사 — 회사별 AI 요약 리포트" },
  { kind:"rnd",      group:"news",   no:"09", cad:"매일 아침 7시", title:"기술 리포트", kick:"TECH REPORTS", sum:"SPRi·KISTEP 새 간행물 + 기술 정보 사이트 바로가기" },
  { kind:"fss",      group:"reg",    no:"10", cad:"매일 아침 7시", title:"회계 모니터링", kick:"ACCOUNTING WATCH", sum:"금감원 · 상장협 · 내부회계운영위 — 제재·지적·자료·규정" },
  { kind:"law",      group:"reg",    no:"11", cad:"매일 아침 7시", title:"법률 모니터링", kick:"WEEKLY REGULATORY MONITOR", sum:"입법예고 · 국회 심사 · 금융위 모니터링" }
];
var state = { kind:null, date:null, manifest:{} };
var frameRO = null;
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); };

/* iframe 높이를 내용 높이에 맞춘다 — 프레임 자체 스크롤바를 없애고 창 스크롤 하나만 남긴다 */
var fitting = false;
function fitFrame(){
  if (fitting) return;
  fitting = true;
  requestAnimationFrame(function(){
    try{
      var f = $("frame"), doc = f && f.contentDocument;
      if (!doc || !doc.body) { fitting = false; return; }
      var b = doc.body, cs = doc.defaultView.getComputedStyle(b);
      var h = Math.max(b.scrollHeight, b.getBoundingClientRect().height) +
              (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
      h = h > 0 ? Math.ceil(h) + 2 : 600;
      if (Math.abs(h - (parseFloat(f.style.height) || 0)) > 1) f.style.height = h + "px";
    } catch(e){}
    fitting = false;
  });
}
var lastW = window.innerWidth;
window.addEventListener("resize", function(){
  if (window.innerWidth === lastW) return;
  lastW = window.innerWidth;
  fitFrame(); layoutGrids();
});

/* 맨 위로 */
(function(){
  var b = $("totop");
  function paint(){ b.classList.toggle("on", (window.scrollY || 0) > 360); }
  b.addEventListener("click", function(){ window.scrollTo({ top:0, behavior:"smooth" }); });
  window.addEventListener("scroll", paint, { passive:true });
  paint();
})();

var d = new Date(), p2 = function(n){ return (n < 10 ? "0" : "") + n; };
$("today").textContent = d.getFullYear() + "." + p2(d.getMonth()+1) + "." + p2(d.getDate()) + " (" + "일월화수목금토"[d.getDay()] + ")";

fetch("manifest.json", { cache:"no-store" })
  .then(function(r){ return r.ok ? r.json() : {}; })
  .then(function(m){ state.manifest = m || {}; renderHome(); route(); })
  .catch(function(){ renderHome(); });

/* 격자 열 수 — 항목 수로 나누어지는 값만 골라 빈 칸이 생기지 않게 한다 */
function pickCols(n, max){
  for (var c = max; c >= 1; c--) if (n % c === 0) return c;
  return max;
}
function layoutGrids(){
  var w = document.documentElement.clientWidth;
  var g = $("snapGrid"), n = g.children.length;
  if (n) g.style.setProperty("--cols", pickCols(n, w >= 1080 ? 6 : w >= 640 ? 3 : 2));
  var t = $("tiles"), m = t.children.length;
  if (m) t.style.setProperty("--cols", w >= 1080 ? pickCols(m, 4) : w >= 720 ? pickCols(m, 3) : w >= 520 ? 2 : 1);
}

/* 마켓 스냅샷 — market.json (30분마다 갱신). 항목이 18개면 6열 격자가 꽉 찬다 */
function loadSnap(){
fetch("market.json", { cache:"no-store" })
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(m){
    if (!m || !m.items || !m.items.length) return;
    state.snapAt = m.at ? m.at + " 기준" : ""; if (tick.frames.length && tick.frames[0].at !== undefined && tick.i % tick.frames.length === 0) $("snapAt").textContent = state.snapAt;
    $("snapGrid").innerHTML = m.items.map(function(it){
      var cls = it.pct == null || it.pct === 0 ? "fl" : (it.pct > 0 ? "up" : "dn");
      var arrow = it.pct == null ? "" : (it.pct > 0 ? "▲ " : it.pct < 0 ? "▼ " : "― ");
      var val = Number(it.last).toLocaleString("ko-KR", { minimumFractionDigits: it.d, maximumFractionDigits: it.d }) + (it.rate ? "%" : "");
      var pct = it.pct == null ? "—" : (it.pct > 0 ? "+" : "") + it.pct.toFixed(2) + "%";
      var sp = "";
      if (it.spark && it.spark.length > 4) {
        var st = 100 / (it.spark.length - 1);
        var pts = it.spark.map(function(v, i){ return (i*st).toFixed(1) + "," + (28 - v/100*26).toFixed(1); }).join(" ");
        var col = cls === "up" ? "var(--acc)" : cls === "dn" ? "var(--dn)" : "var(--n5)";
        sp = '<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">' +
             '<polygon points="0,30 ' + pts + ' 100,30" fill="' + col + '"/>' +
             '<polyline points="' + pts + '" stroke="' + col + '"/></svg>';
      }
      return '<div class="sn"><div class="l">' + esc(it.label) + '</div><div class="v">' + val + '</div>' +
             '<div class="c ' + cls + '">' + arrow + pct + '</div>' + sp + '</div>';
    }).join("");
    $("snapGrid").hidden = false;
    layoutGrids();
  })
  .catch(function(){});
}

/* 서울 날씨 — weather.json (아이콘은 Lucide 해 하나로 고정, 글자로 상태를 전한다) */
function loadWx(){
fetch("weather.json", { cache:"no-store" })
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(w){
    if (!w || w.temp == null) return;
    var t = (w.city || "서울") + " " + Math.round(w.temp) + "°";
    if (w.desc) t += " " + w.desc;
    if (w.tmin != null && w.tmax != null) t += " · " + Math.round(w.tmin) + "°/" + Math.round(w.tmax) + "°";
    if (w.pop != null && w.pop > 0) t += " · 강수 " + w.pop + "%";
    $("wxText").textContent = t;
    $("wx").hidden = false;
  })
  .catch(function(){});
}

/* 포스터 전광판 — 시장 한 줄 → KT·빅테크 최신 뉴스 → 새 간행물, 6초마다 */
var tick = { frames: [], i: 0 };
function jget(u){ return fetch(u, { cache:"no-store" }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }); }
function todayIso(){ var d = new Date(); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function isFresh(b){ var ds = state.manifest[b.kind] || []; return ds.length && String(ds[0]).indexOf(todayIso()) === 0; }

/* 포스터 장면: 시장 한 줄 → 시황 브리핑 '오늘의 흐름'(lead.json 의 bullets, 있을 때) → 없으면 KT·빅테크·간행물 뉴스 */
function buildFrames(lead, tech, kt, rnd){
  var fr = [], at = state.snapAt || "";
  if (lead && lead.text) fr.push({ k: lead.ed === "pm" ? "오후 시장 한 줄" : (lead.ed === "am" ? "오전 시장 한 줄" : "오늘 시장 한 줄"), t: lead.text, at: at });
  if (lead && lead.bullets && lead.bullets.length) {
    lead.bullets.forEach(function(b){ fr.push({ k: "오늘의 흐름" + (b.risk ? " · 리스크 신호" : ""), t: b.t || b, at: "시황 브리핑" }); });
  } else {
    ((kt && kt.items) || []).slice(0, 2).forEach(function(a){ fr.push({ k: "KT그룹 뉴스", t: a.t, at: "" }); });
    ((tech && tech.items) || []).slice(0, 2).forEach(function(a){ fr.push({ k: "빅테크·AI", t: a.t, at: "" }); });
    ((rnd && rnd.items) || []).slice(0, 1).forEach(function(a){ fr.push({ k: "새 간행물", t: a.t, at: "" }); });
  }
  return fr;
}
function setFrame(f){
  $("leadK").textContent = f.k; $("leadText").textContent = f.t; $("snapAt").textContent = f.at || "";
  $("leadPos").textContent = (tick.i % tick.frames.length + 1) + " / " + tick.frames.length;
  $("leadCtl").hidden = tick.frames.length < 2;
}
var leadTimer = null;
function showFrame(){
  if (!tick.frames.length) return;
  var f = tick.frames[tick.i % tick.frames.length], el = $("lead");
  if (!el.dataset.ready) { setFrame(f); el.dataset.ready = "1"; return; }
  el.classList.add("sw");
  clearTimeout(leadTimer);
  leadTimer = setTimeout(function(){ setFrame(f); el.classList.remove("sw"); }, 300);
}
function stepFrame(d){ var n = tick.frames.length; if (n < 2) return; tick.i = (tick.i + d + n) % n; showFrame(); }
$("leadPrev").addEventListener("click", function(){ stepFrame(-1); });
$("leadNext").addEventListener("click", function(){ stepFrame(1); });
$("leadGo").addEventListener("click", function(){ if ((state.manifest.morning || []).length) openReader("morning"); });
var leadHover = false;
$("lead").addEventListener("mouseenter", function(){ leadHover = true; });
$("lead").addEventListener("mouseleave", function(){ leadHover = false; });
setInterval(function(){ if (!leadHover && tick.frames.length > 1 && !$("home").hidden) stepFrame(1); }, 6000);

/* 뉴스 와이어 — 3건씩 좌우로 넘긴다 */
var wire = { items: [], page: 0 };
function renderWire(kt, tech, rnd){
  if (kt || tech || rnd) wire.items = [].concat(
    ((kt && kt.items) || []).map(function(a){ return { s:"KT그룹 뉴스", t:a.t, l:a.l }; }),
    ((tech && tech.items) || []).map(function(a){ return { s:"빅테크·AI", t:a.t, l:a.l }; }),
    ((rnd && rnd.items) || []).map(function(a){ return { s:"새 간행물", t:a.t, l:a.l }; }));
  var n = Math.max(1, Math.ceil(wire.items.length / 3)); wire.page = wire.page % n;
  $("wireList").innerHTML = wire.items.slice(wire.page * 3, wire.page * 3 + 3).map(function(r){
    return '<a href="' + esc(r.l) + '" target="_blank" rel="noopener"><span class="src">' + esc(r.s) + '</span><span class="t">' + esc(r.t) + '</span></a>';
  }).join("");
  $("wirePos").textContent = wire.items.length ? (wire.page + 1) + " / " + n : "";
}
function stepWire(d){
  var n = Math.ceil(wire.items.length / 3); if (n < 2) return;
  var box = $("wirebox"); box.classList.add("sw");
  setTimeout(function(){ wire.page = (wire.page + d + n) % n; renderWire(); box.classList.remove("sw"); }, 250);
}
$("wirePrev").addEventListener("click", function(){ stepWire(-1); });
$("wireNext").addEventListener("click", function(){ stepWire(1); });

function loadLead(){
  Promise.all([jget("lead.json"), jget("briefs/tech/feed.json"), jget("briefs/ktnews/feed.json"), jget("briefs/rnd/feed.json")])
    .then(function(rs){
      var had = tick.frames.length;
      tick.frames = buildFrames(rs[0], rs[1], rs[2], rs[3]);
      if (tick.frames.length && !had) showFrame();
      renderWire(rs[2], rs[1], rs[3]);
    });
}

function refreshLive(){ loadSnap(); loadWx(); loadLead(); }
refreshLive();
setInterval(refreshLive, 5 * 60 * 1000);
document.addEventListener("visibilitychange", function(){ if (!document.hidden) refreshLive(); });

function dates(kind){ return state.manifest[kind] || []; }
function prettyDate(dd){ return String(dd).replace(/-am$/, " 오전").replace(/-pm$/, " 오후"); }

function renderHome(){
  /* 메뉴: 오늘 + 분류 3개 */
  var cur = BRIEFS.filter(function(b){ return b.kind === state.kind; })[0], curG = cur ? cur.group : null;
  var tabs = '<button class="tab' + (state.kind ? "" : " on") + '" data-kind="" type="button"><span class="sq"></span>오늘</button>';
  GROUPS.forEach(function(g){
    var n = BRIEFS.filter(function(b){ return b.group === g[0]; }).length;
    tabs += '<button class="tab' + (curG === g[0] ? " on" : "") + '" type="button" data-group="' + g[0] + '" aria-expanded="false">' + esc(g[1]) + '<span class="cnt tnum">' + n + '</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>';
  });
  $("tabs").innerHTML = tabs;
  $("megaCols").innerHTML = GROUPS.map(function(g){
    return '<div class="col" data-group="' + g[0] + '"><div class="h">' + esc(g[1]) + '</div>' + BRIEFS.filter(function(b){ return b.group === g[0]; }).map(function(b){
      var ds = dates(b.kind), has = ds.length > 0, fr = has && isFresh(b), latest = ds[0] || "";
      return '<a href="#' + b.kind + '" data-kind="' + b.kind + '" class="' + (has ? "" : "off") + (state.kind === b.kind ? " on" : "") + '"><span class="no tnum">' + b.no + '</span><span class="t">' + esc(b.title) + '</span><span class="d tnum' + (fr ? " fresh" : "") + '">' + (has ? (fr ? "오늘" : latest.slice(5, 10)) : "준비 중") + '</span></a>';
    }).join("") + '</div>';
  }).join("");
  var fresh = BRIEFS.filter(isFresh), pending = BRIEFS.filter(function(b){ return !isFresh(b); });
  /* 타일 */
  $("tiles").innerHTML = BRIEFS.map(function(b){
    var ds = dates(b.kind), has = ds.length > 0, fr = has && isFresh(b), latest = ds[0] || "";
    var tag = fr ? '<span class="tag acc">오늘 ' + (/-am$/.test(latest) ? "오전" : /-pm$/.test(latest) ? "오후" : "발행") + '</span>'
                 : (has ? '<span class="tag neu">최신 ' + prettyDate(latest) + '</span>' : '<span class="tag neu">준비 중</span>');
    return '<a class="tile' + (has ? "" : " off") + '" href="#' + b.kind + '" data-kind="' + b.kind + '">' +
      '<div class="hd"><span class="no tnum">' + b.no + '</span><span class="cad">' + esc(has ? b.cad : "준비 중") + '</span></div>' +
      '<div class="ttl">' + esc(b.title) + '</div>' +
      '<div class="ft">' + tag + (has ? '<span class="go">열기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span>' : '') + '</div></a>';
  }).join("") + '<div class="status"><span class="kick">발행 현황</span><div class="big tnum"><b>' + fresh.length + '</b><span>/ ' + BRIEFS.length + ' 종 오늘 발행</span></div><p>' +
    esc(pending.length ? "미발행 " + pending.map(function(b){ return b.title + " (" + b.cad + ")"; }).join(", ") : "오늘 아침 브리핑이 모두 발행되었습니다.") +
    '</p></div>';
  layoutGrids();
}
var GROUPS = [["market", "데일리 마켓"], ["news", "뉴스"], ["reg", "규제·회계"]];
var menuG = null;
function setMenu(g){
  menuG = g;
  $("mega").hidden = !g;
  [].forEach.call($("tabs").children, function(t){ var on = !!g && t.dataset.group === g; t.classList.toggle("hov", on); if (t.dataset.group) t.setAttribute("aria-expanded", on ? "true" : "false"); });
  [].forEach.call($("megaCols").children, function(c){ c.classList.toggle("dim", !!g && c.dataset.group !== g); });
}
$("tabs").addEventListener("mouseover", function(ev){
  var t = ev.target.closest(".tab"); if (!t) return;
  setMenu(t.dataset.group || null);
});
$("tabs").addEventListener("click", function(ev){
  var t = ev.target.closest(".tab"); if (!t) return;
  if (t.dataset.group) { setMenu(menuG === t.dataset.group ? null : t.dataset.group); return; }
  setMenu(null); goHome();
});
$("megaCols").addEventListener("mouseover", function(ev){
  var c = ev.target.closest(".col"); if (c && c.dataset.group !== menuG) setMenu(c.dataset.group);
});
$("menu").addEventListener("mouseleave", function(){ setMenu(null); });
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape") setMenu(null); });
$("megaCols").addEventListener("click", function(ev){
  var a = ev.target.closest("a[data-kind]"); if (!a) return;
  ev.preventDefault(); setMenu(null); openReader(a.dataset.kind);
});
$("tiles").addEventListener("click", function(ev){
  var t = ev.target.closest(".tile"); if (!t) return;
  ev.preventDefault();
  if (!t.classList.contains("off")) openReader(t.dataset.kind);
});

/* 딥링크 — #rates 처럼 브리핑으로 바로 들어온다 */
function route(){
  var kind = (location.hash || "").replace("#", "");
  var known = BRIEFS.some(function(b){ return b.kind === kind; });
  if (known && dates(kind).length) {
    if (state.kind !== kind || $("reader").hidden) openReader(kind, true);
  } else if (!$("reader").hidden) {
    goHome(true);
  }
}
window.addEventListener("hashchange", route);

function paintTabs(){
  var cur = BRIEFS.filter(function(b){ return b.kind === state.kind; })[0], curG = cur ? cur.group : null;
  [].forEach.call($("tabs").children, function(t){ t.classList.toggle("on", t.dataset.group ? t.dataset.group === curG : !state.kind); });
  [].forEach.call($("megaCols").querySelectorAll("a[data-kind]"), function(a){ a.classList.toggle("on", a.dataset.kind === state.kind); });
}
function goHome(fromRoute){
  document.body.classList.remove("reading");
  state.kind = null;
  $("reader").hidden = true; $("home").hidden = false;
  paintTabs();
  if (!fromRoute && location.hash) history.pushState(null, "", location.pathname + location.search);
  window.scrollTo({ top:0, behavior:"smooth" });
}
function openReader(kind, fromRoute){
  if (!fromRoute && location.hash !== "#" + kind) history.pushState(null, "", "#" + kind);
  document.body.classList.add("reading");
  state.kind = kind; state.date = dates(kind)[0] || null;
  $("home").hidden = true; $("reader").hidden = false;
  var b = BRIEFS.filter(function(x){ return x.kind === kind; })[0];
  $("rkick").textContent = b.kick + " · " + b.cad;
  $("rtitle").textContent = b.title;
  $("rsum").textContent = b.sum;
  var nb = nextBrief(kind);
  if (nb) {
    $("next").hidden = false;
    $("next").innerHTML = "다음: " + esc(nb.title) + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
    $("next").onclick = function(){ openReader(nb.kind); };
  } else { $("next").hidden = true; }
  paintTabs();
  renderReader();
  window.scrollTo(0, 0);
}
function nextBrief(kind){
  var idx = -1;
  BRIEFS.forEach(function(b, i){ if (b.kind === kind) idx = i; });
  for (var i = 1; i < BRIEFS.length; i++) { var b = BRIEFS[(idx + i) % BRIEFS.length]; if (dates(b.kind).length) return b; }
  return null;
}
$("homeLink").addEventListener("click", function(ev){ ev.preventDefault(); goHome(); });

function renderReader(){
  var ds = dates(state.kind).slice().sort().reverse(), sel = $("dates");
  sel.innerHTML = "";
  ds.forEach(function(dd, i){
    var op = document.createElement("option");
    op.value = dd; op.textContent = prettyDate(dd) + (i === 0 ? " (최신)" : "");
    if (dd === state.date) op.selected = true;
    sel.appendChild(op);
  });
  sel.onchange = function(){ state.date = this.value; renderReader(); };
  $("dnote").textContent = "전체 " + ds.length + "회차";
  if (!state.date) { $("frame").hidden = true; $("empty").hidden = false; return; }
  $("empty").hidden = true;
  var f = $("frame");
  f.hidden = false;
  f.onload = function(){
    try {
      var doc = f.contentDocument;
      var base = doc.createElement("base"); base.target = "_blank";
      var head = doc.head || doc.documentElement;
      head.insertBefore(base, head.firstChild);
      mobilize(doc);
      fitFrame();
      try{
        if (window.ResizeObserver) {
          if (frameRO) frameRO.disconnect();
          frameRO = new ResizeObserver(fitFrame);
          frameRO.observe(doc.body);
        }
      } catch(e){}
    } catch(e){}
  };
  var src = "briefs/" + state.kind + "/" + state.date + ".html?v=" + Date.now();
  try { f.contentWindow.location.replace(src); } catch (e) { f.src = src; }
}

/* 이메일용 고정폭 브리핑을 좁은 화면에 맞게 풀어준다 */
function mobilize(doc){
  if (!doc || window.innerWidth >= 640) return;
  doc.querySelectorAll("table").forEach(function(t){
    var w = parseInt(t.getAttribute("width"), 10) || parseInt((t.style.width || "").replace("px",""), 10) || 0;
    if (w >= 480) { t.style.setProperty("width","100%","important"); t.style.setProperty("max-width", w + "px","important"); t.removeAttribute("width"); }
  });
  doc.querySelectorAll("th[width], td[width]").forEach(function(c){ if (parseInt(c.getAttribute("width"), 10) >= 30) c.removeAttribute("width"); });
  var st = doc.createElement("style");
  st.textContent = "html,body{overflow-x:hidden;word-break:keep-all;-webkit-text-size-adjust:100% !important;text-size-adjust:100% !important;}" +
    "img{max-width:100%;height:auto;}td,th{white-space:normal !important;}" +
    "td span{max-width:100% !important;word-break:break-all !important;white-space:normal !important;box-sizing:border-box;}";
  (doc.head || doc.documentElement).appendChild(st);
}
</script>
