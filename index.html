<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Office Lab</title>
<style>
  :root{ --ink:#201e1d; --acc:#ec3013; --bg:#e9e7e7; --line:#d8d4d3; --mut:#7d7979; }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}  /* hidden 속성이 항상 이기게 — 탭 전환 시 이전 내용 잔상 방지 */
  body{margin:0;background:var(--bg);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);}
  .top{background:#fff;border-bottom:1px solid var(--line);}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px;}
  .head{padding:26px 0 0;}
  .kick{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--acc);}
  h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:6px 0 16px;}
  .bar{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;padding-bottom:0;}
  .tab{appearance:none;border:1px solid var(--line);border-bottom:none;background:#f4f2f2;
       color:var(--mut);font:inherit;font-size:13.5px;font-weight:700;padding:9px 16px;cursor:pointer;}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tab:hover:not(.on){background:#fff;color:var(--ink);}
  .spacer{flex:1;}
  select{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);background:#fff;
         color:var(--ink);margin-bottom:6px;max-width:150px;}
  .body{padding:18px 16px 40px;}
  .card{max-width:680px;margin:0 auto;background:#fff;border:1px solid var(--line);}
  iframe{display:block;width:100%;height:calc(100vh - 210px);min-height:520px;border:0;background:#fff;}
  .empty{padding:70px 20px;text-align:center;color:var(--mut);font-size:14px;line-height:1.8;}
  .empty b{color:var(--ink);}
  .foot{max-width:680px;margin:10px auto 0;font-size:11px;color:var(--mut);text-align:right;}
  /* 모바일: 좁은 화면에서는 머리글·탭을 가운데 정렬 */
  @media (max-width:640px){
    .head{text-align:center;}
    .bar{justify-content:center;}
    .spacer{display:none;}
    select{margin:8px 0 6px;}
    .body{padding:14px 10px 30px;}
    iframe{height:calc(100vh - 240px);}
    .foot{text-align:center;}
  }
</style>
</head>
<body>
<div class="top">
  <div class="wrap head">
    <div class="kick">DAILY BRIEFING</div>
    <h1>AI Office Lab</h1>
    <div class="bar">
      <button class="tab on" data-kind="morning">시황</button>
      <button class="tab" data-kind="econscan">금융통계</button>
      <button class="tab" data-kind="econrisk">경제리스크</button>
      <button class="tab" data-kind="ir">IR캘린더</button>
      <button class="tab" data-kind="law">법률</button>
      <span class="spacer"></span>
      <select id="dateSel" title="지난 브리핑 보기"></select>
    </div>
  </div>
</div>
<div class="body">
  <div class="card">
    <div class="empty" id="empty" hidden>
      <b>아직 발행된 브리핑이 없습니다.</b><br>
      매일 아침 자동으로 새 브리핑이 올라옵니다.
    </div>
    <iframe id="frame" title="브리핑 본문" hidden></iframe>
  </div>
  <div class="foot" id="foot"></div>
</div>
<script>
var state = { kind: "morning", manifest: {} };
var $ = function (id) { return document.getElementById(id); };

fetch("manifest.json?t=" + Date.now())
  .then(function (r) { return r.ok ? r.json() : {}; })
  .then(function (m) { state.manifest = m || {}; render(); })
  .catch(function () { render(); });

document.querySelectorAll(".tab").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    state.kind = b.getAttribute("data-kind");
    render();
  });
});

$("dateSel").addEventListener("change", function () { show(this.value); });

function dates() { return state.manifest[state.kind] || []; }

function render() {
  var ds = dates(), sel = $("dateSel");
  sel.innerHTML = "";
  ds.forEach(function (d) {
    var o = document.createElement("option");
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  });
  sel.hidden = ds.length === 0;
  if (ds.length === 0) { $("frame").hidden = true; $("empty").hidden = false; $("foot").textContent = ""; return; }
  $("empty").hidden = true;
  show(ds[0]);
}

function show(d) {
  var f = $("frame");
  f.hidden = false;
  f.onload = function () {
    try {
      var doc = f.contentDocument;
      /* 뉴스 링크는 새 탭으로 — 언론사가 iframe 안에서 열리는 걸 거부하기 때문 */
      var b = doc.createElement("base");
      b.target = "_blank";
      var head = doc.head || doc.documentElement;
      head.insertBefore(b, head.firstChild);
      mobilize(doc);
    } catch (e) {}
  };
  f.src = "briefs/" + state.kind + "/" + d + ".html";
  $("foot").textContent = d + " 발행";
}

/* 브리핑 본문은 이메일용이라 폭 600px 고정 — 좁은 화면에서는
   고정폭 표를 화면 폭에 맞게 풀어서 좌우 스크롤을 없앤다 (같은 사이트라 접근 가능) */
function mobilize(doc) {
  if (!doc || window.innerWidth >= 640) return;
  doc.querySelectorAll("table").forEach(function (t) {
    var w = parseInt(t.getAttribute("width"), 10) ||
            parseInt((t.style.width || "").replace("px", ""), 10) || 0;
    if (w >= 480) {
      t.style.setProperty("width", "100%", "important");
      t.style.setProperty("max-width", w + "px", "important");
      t.removeAttribute("width");
    }
  });
  var st = doc.createElement("style");
  st.textContent = "body{overflow-x:hidden;word-break:keep-all;} img{max-width:100%;height:auto;}";
  (doc.head || doc.documentElement).appendChild(st);
}
</script>
</body>
</html>
